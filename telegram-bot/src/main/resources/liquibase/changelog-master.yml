databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-notification-task-table.yaml
      relativeToChangelogFile: true
  - include:
      file: db/changelog/changes/002-create-datetime-index.yaml
      relativeToChangelogFile: true

  - changeSet:
      id: 1
      author: developer
      changes:
        - createTable:
            tableName: notification_task
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chat_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: message_text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: notification_date_time
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_notification_task_datetime
            tableName: notification_task
            columns:
              - column:
                  name: notification_date_time
                  sortOrder: ASC